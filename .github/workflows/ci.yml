name: CI

on:
  push:
    branches: [main, develop, "module/**"]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend lint and tests
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: ucp
          POSTGRES_PASSWORD: ci-only
          POSTGRES_DB: ucp_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U ucp -d ucp_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      TEST_DATABASE_URL: postgresql+asyncpg://ucp:ci-only@127.0.0.1:5432/ucp_test
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10.3.3
        with:
          version: "0.9.24"
      - run: uv sync --frozen
      - run: uv run ruff check .
      - run: uv run ruff format --check .
      - run: uv run pytest

  web:
    name: Web checks, builds and browser tests
    runs-on: ubuntu-latest
    env:
      # Same place as on a developer machine, so the install step and the tests agree.
      PLAYWRIGHT_BROWSERS_PATH: ${{ github.workspace }}/.tools/ms-playwright
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
      - run: npm run size --workspace @ucp/loader
      - run: npm run size --workspace @ucp/widget
      - run: npx playwright install --with-deps
      - run: npm run e2e

  gateway:
    name: Gateway journeys and load
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: ucp
          POSTGRES_PASSWORD: ci-only
          POSTGRES_DB: ucp_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U ucp -d ucp_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      UCP_DATABASE_URL: postgresql+asyncpg://ucp:ci-only@127.0.0.1:5432/ucp_test
      PLAYWRIGHT_BROWSERS_PATH: ${{ github.workspace }}/.tools/ms-playwright
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - uses: astral-sh/setup-uv@v10.3.3
        with:
          version: "0.9.24"
      - run: npm ci
      - run: npm run build
      - run: uv sync --frozen
        working-directory: backend
      - run: npx playwright install --with-deps chromium firefox webkit
      # The real chat on a customer's page, through the real gateway (backend/devstack.py) to the fake PF.
      - run: npm run e2e:gateway
      - name: API journey and load test (gateway adds at most 150 ms to the first word at the 95th percentile)
        working-directory: backend
        run: |
          FAKE_PF_SPEED=0.1 uv run python devstack.py &
          curl --fail --silent --retry 60 --retry-delay 1 --retry-all-errors http://127.0.0.1:8200/readyz
          uv run python journey.py http://localhost:8200 w_gateway
          uv run python loadtest.py --visitors 25 --turns 5

  identity:
    name: Sign-in through a real identity provider
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: ucp
          POSTGRES_PASSWORD: ci-only
          POSTGRES_DB: ucp_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U ucp -d ucp_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      TEST_DATABASE_URL: postgresql+asyncpg://ucp:ci-only@127.0.0.1:5432/ucp_test
      KEYCLOAK_URL: http://localhost:8080
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10.3.3
        with:
          version: "0.9.24"
      - run: uv sync --frozen
      # A throwaway Keycloak with a throwaway administrator, alive only for this job.
      - run: >-
          docker run --detach --name keycloak --publish 8080:8080
          --env KC_BOOTSTRAP_ADMIN_USERNAME=admin --env KC_BOOTSTRAP_ADMIN_PASSWORD=admin
          quay.io/keycloak/keycloak:26.0.5 start-dev
      - run: curl --fail --silent --retry 90 --retry-delay 2 --retry-all-errors http://localhost:8080/realms/master > /dev/null
      - run: uv run pytest tests/test_keycloak.py -v

  image:
    name: Container image builds and starts
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - run: docker build --file backend/Dockerfile --tag ucp-gateway:ci .
      - run: |
          docker run --detach --name gateway --publish 8000:8000 ucp-gateway:ci
          curl --fail --silent --retry 20 --retry-delay 1 --retry-all-errors http://127.0.0.1:8000/healthz
          # The gateway names no server software.
          ! curl --silent --head http://127.0.0.1:8000/healthz | grep -i '^server:'
          # The built loader and chat are inside, and served.
          curl --fail --silent http://127.0.0.1:8000/loader.js > /dev/null

  secrets:
    name: Secret scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - run: docker run --rm --volume "$PWD:/repo" ghcr.io/gitleaks/gitleaks:v8.30.1 git --redact --no-banner /repo
